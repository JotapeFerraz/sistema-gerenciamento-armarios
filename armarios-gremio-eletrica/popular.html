<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Popular Banco de Dados</title>
</head>
<body>
    <h2>Script de Criação de Armários</h2>
    <p>Abra o console do navegador (F12) para ver o resultado, e depois clique no botão abaixo.</p>
    
    <button id="btn-gerar">Gerar 176 Armários no Firebase</button>

    <script type="module">
        // Importando o banco de dados da sua configuração existente
        import { db } from "./js/firebase.js";
        
        // Importando as funções necessárias do Firestore
        import { writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        document.getElementById("btn-gerar").addEventListener("click", async () => {
            try {
                console.log("Iniciando a criação dos armários...");
                const batch = writeBatch(db);

                // 1. Gerar os 32 armários do Corredor do Grêmio (C-01 a C-32)
                for (let i = 1; i <= 32; i++) {
                    // padStart garante que o número 1 vire '01', o 2 vire '02', etc.
                    let numeroFormatado = i.toString().padStart(2, '0');
                    let id = `C-${numeroFormatado}`;
                    
                    let armarioRef = doc(db, "armarios", id);
                    batch.set(armarioRef, {
                        numero: id,
                        localizacao: "Corredor Grêmio",
                        status: "livre",
                        usuarioAlocado: "",
                        dataInicio: null,
                        dataFim: null,
                        linkComprovantePix: "",
                        linkTermo: ""
                    });
                }

                // 2. Gerar os 144 armários do Bloco 4 (B4-001 a B4-144)
                for (let i = 1; i <= 144; i++) {
                    // padStart garante que fique com 3 dígitos: '001', '042', '144'
                    let numeroFormatado = i.toString().padStart(3, '0');
                    let id = `B4-${numeroFormatado}`;
                    
                    let armarioRef = doc(db, "armarios", id);
                    batch.set(armarioRef, {
                        numero: id,
                        localizacao: "Bloco 4 - 1º Andar",
                        status: "livre",
                        usuarioAlocado: "",
                        dataInicio: null,
                        dataFim: null,
                        linkComprovantePix: "",
                        linkTermo: ""
                    });
                }

                // Envia tudo para o Firebase de uma vez só
                await batch.commit();
                
                alert("Sucesso! Todos os 176 armários foram criados no Firestore.");
                console.log("Lote concluído com sucesso!");

            } catch (error) {
                console.error("Erro ao gerar armários: ", error);
                alert("Deu erro! Veja o console (F12) para detalhes.");
            }
        });
    </script>
</body>
</html>
