<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - G3E</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .admin-table th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="user-info">Administração G3E</div>
        <button onclick="window.location.href='reserva.html'" class="btn-secondary">Voltar ao Mapa</button>
    </header>

    <main class="admin-container">
        <h2>Controlo de Armários Alugados</h2>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Armário</th>
                    <th>Aluno</th>
                    <th>Data de Início</th>
                    <th>Data de Expiração</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <tr><td colspan="5">A carregar dados...</td></tr>
            </tbody>
        </table>
        <!-- MODAL DE DADOS DO ALUNO -->
    <div id="modal-aluno" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="fechar-modal-aluno">&times;</span>
            <h2>Ficha do Alugador</h2>
            <div style="margin-top: 15px; line-height: 1.8;">
                <p><strong>Nome:</strong> <span id="detalhe-nome"></span></p>
                <p><strong>Matrícula:</strong> <span id="detalhe-matricula"></span></p>
                <p><strong>CPF:</strong> <span id="detalhe-cpf"></span></p>
                <p><strong>Telefone/WhatsApp:</strong> <span id="detalhe-telefone"></span></p>
                <p><strong>E-mail:</strong> <span id="detalhe-email"></span></p>
            </div>
        </div>
    </div>
    </main>

    <script type="module" src="./js/admin.js"></script>
<footer class="app-footer">
        <p>&copy; 2026 G3E. Desenvolvido por <strong>João Pedro Ferraz</strong>. <br> Última atualização: Setembro de 2026.</p>
    </footer>
</body>
</html>
